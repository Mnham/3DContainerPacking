name: Deploy Demo App to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish demo app
        run: dotnet publish src/CromulentBisgetti.DemoApp/CromulentBisgetti.DemoApp.csproj --configuration Release --output ./artifacts/demo-pages

      - name: Set GitHub Pages base path
        run: |
          sed -i 's|<base href="/" />|<base href="/3DContainerPacking/" />|' ./artifacts/demo-pages/wwwroot/index.html
          sed -i 's|<base href="/" />|<base href="/3DContainerPacking/" />|' ./artifacts/demo-pages/wwwroot/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./artifacts/demo-pages/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
